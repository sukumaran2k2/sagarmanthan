server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: the SPA calls VITE_API_BASE_URL=/api (see docker-compose.yml). Forward those
    # requests to the backend service and strip the /api prefix, since backend routes are mounted at
    # the root (e.g. /login-validation, /mmt-dropdown/:tid). The trailing slash on proxy_pass does
    # the stripping: /api/login-validation -> http://backend:3000/login-validation.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match the backend's 50mb body limit and allow slow report/upload endpoints to finish.
        client_max_body_size 50m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Serve the SPA and let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
