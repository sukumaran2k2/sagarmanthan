services:
  clamav:
    image: clamav/clamav:stable
    container_name: sagarmanthan-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

  backend:
    build: ./backend
    container_name: sagarmanthan-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/fileuploads:/app/fileuploads
      - ./backend/demoFiles:/app/demoFiles
      - ./backend/formbuilder_Files:/app/formbuilder_Files
      - ./backend/delete_log:/app/delete_log
    depends_on:
      clamav:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_RSA_PUBLIC_KEY: ${VITE_RSA_PUBLIC_KEY}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    container_name: sagarmanthan-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  clamav_data:
